<title>007 — flow between</title>
<style>

<body>
<canvas id="c"></canvas>
<div id="title"><b>007 — flow between</b>
九十六根棒做同一個動作。會動的只有它們之間的關係。
流動不住在任何一根棒裡。</div>
<div id="hud"></div>
<script>
"use strict";
// ---------- constants ----------
const N = 96;                 // elements
const F = 0.35;               // Hz, identical for every bar
const K_MAX = 6;              // full phase turns across field at s=0.5
const SWEEP = 180;            // s, full out-and-back
const SEED = 0x2A;
const TS = new URLSearchParams(location.search).get("probe") ? 30 : 1;
const PROBE = TS !== 1;

// ---------- deterministic noise field ----------
function xorshift32(x){ x^=x<<13; x>>>=0; x^=x>>17; x^=x<<5; x>>>=0; return x>>>0; }
const noise = new Float64Array(N);
{ let st = SEED>>>0;
  for (let i=0;i<N;i++){ st = xorshift32(st||1); noise[i] = (st/4294967296 - 0.5)*2*Math.PI; } }

// ---------- phase field ----------
// s in [0,1]: edge A (0→0.5) dφ ramps 0→2πK/N, σ=0
//             edge B (0.5→1) dφ held, σ ramps 0→1
function fieldAt(s){
  const eA = Math.min(s,0.5)/0.5, eB = Math.max(0,s-0.5)/0.5;
  return { dphi: eA * 2*Math.PI*K_MAX/N, sigma: eB };
}
function phase(i, fld){ return fld.dphi*i + fld.sigma*noise[i]; }

// ---------- the two ears ----------
function orderPair(fld){
  let cr=0, sr=0, ca=0, sa=0;
  let prev = phase(0,fld);
  cr += Math.cos(prev); sr += Math.sin(prev);
  for (let i=1;i<N;i++){
    const p = phase(i,fld);
    cr += Math.cos(p); sr += Math.sin(p);
    const d = p - prev;
    ca += Math.cos(d); sa += Math.sin(d);
    prev = p;
  }
  return { R: Math.hypot(cr,sr)/N, A: Math.hypot(ca,sa)/(N-1) };
}

// ---------- breathing pace (pass 2): walk by the gauge, not the map ----------
// Time is re-parameterized by arc length in instrument space (R,A):
// the piece walks at constant *perceptual* speed. β blends with uniform
// so flat regions keep moving. Pure function of constants → deterministic.
const M = 480, BETA = 0.7;
const warpC = new Float64Array(M + 1);
{
  const Rs = new Float64Array(M + 1), As = new Float64Array(M + 1);
  for (let j = 0; j <= M; j++){ const o = orderPair(fieldAt(j / M)); Rs[j] = o.R; As[j] = o.A; }
  let arc = 0; const d = new Float64Array(M);
  for (let j = 0; j < M; j++){ d[j] = Math.hypot(Rs[j+1]-Rs[j], As[j+1]-As[j]); arc += d[j]; }
  let c = 0;
  for (let j = 0; j < M; j++){ c += (1 - BETA) / M + BETA * d[j] / arc; warpC[j + 1] = c; }
  for (let j = 0; j <= M; j++) warpC[j] /= warpC[M];   // exact 1 at the end (float guard)
}
function warpSeg(u){        // binary search: warpC[lo] <= u < warpC[lo+1]
  let lo = 0, hi = M;
  while (hi - lo > 1){ const mid = (lo + hi) >> 1; if (warpC[mid] <= u) lo = mid; else hi = mid; }
  return lo;
}
function warp(u){           // time fraction u∈[0,1] → parameter s∈[0,1]
  if (u <= 0) return 0; if (u >= 1) return 1;
  const lo = warpSeg(u);
  return (lo + (u - warpC[lo]) / (warpC[lo + 1] - warpC[lo])) / M;
}
function dwellAt(u){        // dwell factor vs uniform walk (HUD)
  if (u <= 0 || u >= 1) return 1;
  const lo = warpSeg(u);
  return (warpC[lo + 1] - warpC[lo]) * M;
}

// ---------- time (no wall clock; gaps dropped) ----------
let tau = 0, last = null, fps = 0, err = 0;
window.addEventListener("error", ()=>{ err++; });

// ---------- probe ----------
const samples = [];
let lastSample = -1;
function fnv(str){ let h=0x811c9dc5;
  for (let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; }
  return h>>>0; }
window.__report = () => {
  const q = samples.map(x=>`${x.s.toFixed(3)},${x.R.toFixed(4)},${x.A.toFixed(4)}`).join(";");
  return { n: samples.length, hash: fnv(q), samples, errors: err, fps: Math.round(fps) };
};
window.__done = false;

// ---------- render ----------
const cv = document.getElementById("c"), cx = cv.getContext("2d");
const hud = document.getElementById("hud");
function resize(){ cv.width = innerWidth*devicePixelRatio; cv.height = innerHeight*devicePixelRatio; }
addEventListener("resize", resize); resize();

function frame(t){
  if (last !== null){
    const dt = (t-last)/1000;
    if (dt > 0 && dt < 0.25){ tau += dt*TS; fps = fps*0.95 + (1/dt)*0.05; }
  }
  last = t;

  const cycle = tau % SWEEP;
  const u = cycle < SWEEP/2 ? cycle/(SWEEP/2) : 2 - cycle/(SWEEP/2); // triangle 0→1→0 (time fraction)
  const s = warp(u);                                                 // breathing pace (pass 2)
  const fld = fieldAt(s);
  const { R, A } = orderPair(fld);

  if (PROBE){
    // sample the LAW, not the frame (first-light repair) — AND sample the
    // SCHEDULE, not the frame (pass-2 repair): a stalled frame can carry
    // floor(tau) across several integers; the old `sec !== lastSample`
    // gate silently dropped the ones in between, so completeness rode
    // frame luck (screenshot stall → 177 vs 180 samples, hashes split).
    // Catch-up loop: every integer tau passed gets its pure re-derivation.
    const top = Math.min(Math.floor(tau), SWEEP);
    for (let sec = lastSample + 1; sec <= top; sec++){
      const ux = sec < SWEEP/2 ? sec/(SWEEP/2) : 2 - sec/(SWEEP/2);
      const sx = warp(ux);
      const ox = orderPair(fieldAt(sx));
      samples.push({ tau: sec, s: sx, R: ox.R, A: ox.A });
      lastSample = sec;
    }
    if (tau > SWEEP && !window.__done){ window.__done = true; }
  }

  // draw
  const W = cv.width, H = cv.height, dpr = devicePixelRatio;
  cx.fillStyle = "#0a0a0c"; cx.fillRect(0,0,W,H);
  const marginX = W*0.08, pitch = (W-2*marginX)/(N-1);
  const midY = H*0.52, amp = H*0.16, barLen = H*0.10, barW = Math.max(1.5*dpr, pitch*0.18);
  const om = 2*Math.PI*F;
  cx.fillStyle = "#d6d2c4";
  for (let i=0;i<N;i++){
    const y = midY + amp*Math.sin(om*tau + phase(i,fld));
    cx.fillRect(marginX + i*pitch - barW/2, y - barLen/2, barW, barLen);
  }

  // triangle instrument (top right): corners U(1,1) W(0,1) C(0,0)
  const tx = W - 150*dpr, ty = 26*dpr, tw = 110*dpr, th = 74*dpr;
  cx.strokeStyle = "#2c2b26"; cx.lineWidth = 1;
  cx.strokeRect(tx, ty, tw, th);
  // axes: x = A (0→1 left→right), y = R (0→1 bottom→top)
  cx.fillStyle = "#55524a";
  cx.font = `${9*dpr}px ui-monospace,monospace`;
  cx.fillText("R", tx-10*dpr, ty+10*dpr);
  cx.fillText("A", tx+tw-8*dpr, ty+th+11*dpr);
  const px = tx + A*tw, py = ty + (1-R)*th;
  cx.fillStyle = "#e8b45a"; cx.beginPath(); cx.arc(px, py, 2.5*dpr, 0, 7); cx.fill();

  hud.textContent =
    `s ${s.toFixed(3)}   dφ ${(fld.dphi*N/(2*Math.PI)).toFixed(2)} turns   σ ${fld.sigma.toFixed(2)}   pace ×${dwellAt(u).toFixed(1)}\n` +
    `R ${R.toFixed(3)}   A ${A.toFixed(3)}   τ ${tau.toFixed(1)}s   fps ${Math.round(fps)}`;

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
