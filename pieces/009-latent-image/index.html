  作品自走 180s 四幕,每幕換一台 C 面目錄裡的轉換器:

    I   — intensity · 底片   |ψ|²           照片看見的。渦旋只是暗粒。
    II  — phase · 相位       arg ψ          螺旋斜坡浮現,奇點成風車。
    III — slope · 水面       |∇ Re ψ|       斜率聚光,焦散式亮絲。
    IV  — thickness · 薄膜   |ψ| 當膜厚     Newton 色,唯一有色的一幕 ——

<head>

<title>009 — latent image · 潛像</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin:0; height:100%; background:#050505; overflow:hidden; }
  canvas { display:block; width:100vw; height:100vh; }
  .hud { position:fixed; font:11px/1.6 "IBM Plex Mono", ui-monospace, monospace;
         color:#555; letter-spacing:.08em; user-select:none; pointer-events:none; }
  #title { top:14px; left:16px; }

<body>
<canvas id="c"></canvas>
<div class="hud" id="title">009 — latent image · 潛像</div>
<div class="hud" id="act"></div>
<div class="hud" id="snd">S · 聲 ○</div>
<pre class="hud" id="probe"></pre>

<script>
'use strict';
const ERRS = [];
addEventListener('error', e => ERRS.push(String(e.message)));
// ---------- deterministic world ----------
const SEED = 0x2C, N = 7;
function xorshift32(s){ let x = s>>>0; return function(){
  x ^= x<<13; x >>>= 0; x ^= x>>17; x ^= x<<5; x >>>= 0; return x/4294967296; }; }
const rnd = xorshift32(SEED);
// sources: fixed positions, spatial freq κ, temporal freq ω (slow, detuned), phase φ
const SRC = [];
for (let k=0; k<N; k++){
  SRC.push({
    x: (rnd()*1.6-0.8), y: (rnd()*1.6-0.8),
    kappa: 22 + rnd()*16,          // wavelength ~0.17-0.29 world units
    omega: 0.05 + rnd()*0.10,      // slow drift; pairwise detunings = beat structure
    phi:   rnd()*Math.PI*2
  });
}
const AMAX = N; // equal unit amplitudes

// ---------- probe doors (world untouched) ----------
const Q = new URLSearchParams(location.search);
const PIN_ACT = Q.has('act') ? (parseInt(Q.get('act'),10)|0) : -1;
const TAU0    = Q.has('tau') ? parseFloat(Q.get('tau')) : 0;
const SOLO    = Q.get('solo') === '1';
const PROBE   = Q.get('probe') === '1';
const NSRC    = SOLO ? 1 : N;

// ---------- field, JS mirror (same math as shader) ----------
function psi(x, y, tau){
  let re=0, im=0;
  for (let k=0; k<NSRC; k++){
    const s=SRC[k], dx=x-s.x, dy=y-s.y, r=Math.sqrt(dx*dx+dy*dy);
    const a = s.kappa*r - s.omega*tau + s.phi;
    re += Math.cos(a); im += Math.sin(a);
  }
  return [re, im];
}

// ---------- schedule ----------
const DT = 1/120, ACT_LEN = 45, CYCLE = 180;
let tau = TAU0, acc = 0, lastT = null;
function actOf(t){ return PIN_ACT >= 0 ? PIN_ACT : (Math.floor(t/ACT_LEN) % 4); }
const ACT_LABEL = [
  'I — intensity · 底片    |ψ|² — 照片看見的;渦旋只是暗粒',
  'II — phase · 相位       arg ψ — 螺旋斜坡;奇點成風車',
  'III — slope · 水面      |∇Reψ| — 斜率聚光,焦散亮絲',
  'IV — thickness · 薄膜   |ψ|→膜厚 — Newton 色,顏色來自物理'
];

// ---------- WebGL ----------
const cv = document.getElementById('c');
const gl = cv.getContext('webgl', {antialias:false, preserveDrawingBuffer:false});
const VS = `attribute vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;
const FS = `
precision highp float;
uniform vec2  uRes;
uniform float uTau;
uniform int   uAct;
uniform int   uN;
uniform vec2  uPos[7];
uniform vec3  uPar[7];   // kappa, omega, phi
const float AMAX = 7.0;

void main(){
  // pixel -> world: y in [-1,1], x scaled by aspect
  vec2 uv = (gl_FragCoord.xy / uRes) * 2.0 - 1.0;
  uv.x *= uRes.x / uRes.y;

  float re = 0.0, im = 0.0, gx = 0.0, gy = 0.0;
  for (int k = 0; k < 7; k++){
    if (k >= uN) break;
    vec2  d = uv - uPos[k];
    float r = max(length(d), 1e-4);
    float a = uPar[k].x * r - uPar[k].y * uTau + uPar[k].z;
    float c = cos(a), s = sin(a);
    re += c; im += s;
    // gradient of Re psi (analytic): d/dx cos(a) = -sin(a) * kappa * dx/r
    gx += -s * uPar[k].x * d.x / r;
    gy += -s * uPar[k].x * d.y / r;
  }

  vec3 ink = vec3(0.051, 0.051, 0.051);        // #0d0d0d — Jie pt monochrome ground
  vec3 lum = vec3(0.792, 0.796, 0.788);        // #cacaca — its light value
  vec3 col;

  if (uAct == 0){
    // I — intensity: what a photograph keeps
    float I = (re*re + im*im) / (AMAX*AMAX);
    col = mix(ink, lum, pow(I, 0.65));
  } else if (uAct == 1){
    // II — phase: the sawtooth spiral ramp; branch cuts stay, honestly
    float th = atan(im, re);                   // [-pi, pi]
    float t01 = fract(th / 6.28318530718 + 1.0);
    float env = clamp(sqrt(re*re + im*im) / AMAX * 3.0, 0.0, 1.0);
    col = mix(ink, lum, t01 * (0.25 + 0.75 * env));
  } else if (uAct == 2){
    // III — slope: light concentrates where the surface runs flat between crossings
    // gradient scales with kappa — normalize by AMAX * mean(kappa) so the
    // flat-loci read as filaments, not dust (first-light instrument repair)
    float g = sqrt(gx*gx + gy*gy) / (AMAX * 30.0);
    float c = pow(1.0 / (1.0 + 60.0 * g * g), 2.0);
    col = mix(ink, lum, c);
  } else {
    // IV — thickness: |psi| as film thickness, per-channel reflectance.
    // weak-reflection limit: interference modulation rides a silver pedestal,
    // so the colors come out muted, not full-saturation (real soap film,
    // and Jie's muted-palette cluster agree here)
    float d = sqrt(re*re + im*im) / AMAX;      // 0..1
    vec3 lambda = vec3(1.00, 0.83, 0.70);      // R:G:B wavelength ratios (700:580:490 nm)
    vec3 refl = 0.5 - 0.5 * cos(6.28318530718 * (2.6 * d) / lambda);
    float m = (refl.r + refl.g + refl.b) / 3.0;
    vec3 muted = mix(vec3(m), refl, 0.45);     // desaturate toward own luminance
    float envd = smoothstep(0.0, 0.06, d);     // deep nulls stay ink, not colored
    col = ink + muted * envd * 0.72;
  }
  gl_FragColor = vec4(col, 1.0);
}`;
function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const locP = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(locP);
gl.vertexAttribPointer(locP, 2, gl.FLOAT, false, 0, 0);
const U = n => gl.getUniformLocation(prog, n);
const uRes = U('uRes'), uTau = U('uTau'), uAct = U('uAct'), uN = U('uN');
gl.uniform1i(uN, NSRC);
const pos = new Float32Array(N*2), par = new Float32Array(N*3);
SRC.forEach((s,k)=>{ pos[k*2]=s.x; pos[k*2+1]=s.y; par[k*3]=s.kappa; par[k*3+1]=s.omega; par[k*3+2]=s.phi; });
gl.uniform2fv(U('uPos[0]'), pos);
gl.uniform3fv(U('uPar[0]'), par);

function resize(){
  const d = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * d; cv.height = innerHeight * d;
  gl.viewport(0, 0, cv.width, cv.height);
  gl.uniform2f(uRes, cv.width, cv.height);
}
addEventListener('resize', resize); resize();

// ---------- render loop: step the schedule, frames catch up ----------
const actEl = document.getElementById('act');
let frames = 0, fpsT0 = performance.now(), fps = 0;
function frame(t){
  if (lastT !== null){
    acc += Math.min((t - lastT) / 1000, 0.25);
    while (acc >= DT){ tau += DT; acc -= DT; }
  }
  lastT = t;
  const act = actOf(tau % CYCLE);
  gl.uniform1f(uTau, tau);
  gl.uniform1i(uAct, act);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  actEl.textContent = ACT_LABEL[act];
  if (earNode) earNode.port.postMessage(tau);   // the ear follows THE schedule
  frames++;
  const now = performance.now();
  if (now - fpsT0 >= 2000){ fps = Math.round(frames * 1000 / (now - fpsT0)); frames = 0; fpsT0 = now; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- pass 2: the ear — fifth developer (audio twin) ----------
// sound(t) = Re[ psi(x_ear, tau) * e^{i 2pi FC t} ] — the field itself, heterodyned.
// Listening points = SRC[0] (L ear) and SRC[1] (R ear): zero new spatial constants;
// the ear stands where the waves are born. FC is the ear's one transducer constant.
// The visual developer hard-cuts every 45 s; the ear's developer never blinks —
// audible continuity across cuts IS P1 made perceptible. No composition anywhere:
// every phase, every detuning, every swell comes from the world's SRC table.
const FC = 220, EAR_GAIN = 0.22;
const EARS = [ {x: SRC[0].x, y: SRC[0].y}, {x: SRC[1].x, y: SRC[1].y} ];
function earTables(){
  // per ear, per source: fixed phase kappa*r + phi, and omega (NSRC honors ?solo)
  return EARS.map(E => {
    const ph = [], om = [];
    for (let k=0; k<NSRC; k++){
      const s = SRC[k], dx = E.x - s.x, dy = E.y - s.y;
      ph.push(s.kappa * Math.sqrt(dx*dx + dy*dy) + s.phi);
      om.push(s.omega);
    }
    return { ph, om };
  });
}
const WORKLET_SRC = `
class EarProcessor extends AudioWorkletProcessor {
  constructor(o){
    super();
    const d = o.processorOptions;
    this.ears = d.ears; this.n = d.n; this.fc = d.fc;
    this.tau = d.tau0; this.t = 0;
    this.port.onmessage = e => {                 // slew toward the visual schedule,
      const err = e.data - this.tau;             // rate-limited: one clock, the ear follows
      this.tau += Math.max(-0.01, Math.min(0.01, err));
    };
  }
  process(inputs, outputs){
    const out = outputs[0], dt = 1 / sampleRate, TWO_PI = 6.283185307179586;
    const L = out[0], R = out.length > 1 ? out[1] : out[0];
    for (let i = 0; i < L.length; i++){
      const wc = TWO_PI * this.fc * this.t;
      for (let e = 0; e < 2; e++){
        const E = this.ears[e]; let v = 0;
        for (let k = 0; k < this.n; k++) v += Math.cos(wc + E.ph[k] - E.om[k] * this.tau);
        (e === 0 ? L : R)[i] = v / this.n;
      }
      this.t += dt; this.tau += dt;
    }
    return true;
  }
}
registerProcessor('ear', EarProcessor);`;
async function buildEar(ctx, tau0){
  const url = URL.createObjectURL(new Blob([WORKLET_SRC], {type:'application/javascript'}));
  await ctx.audioWorklet.addModule(url);
  return new AudioWorkletNode(ctx, 'ear', {
    numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2],
    processorOptions: { ears: earTables(), n: NSRC, fc: FC, tau0 }
  });
}
let AC = null, earNode = null, earGain = null, soundOn = false;
const sndEl = document.getElementById('snd');
async function toggleSound(){
  try {
    if (!AC){
      AC = new (window.AudioContext || window.webkitAudioContext)();
      earGain = AC.createGain(); earGain.gain.value = 0;
      earNode = await buildEar(AC, tau);
      earNode.connect(earGain); earGain.connect(AC.destination);
    }
    if (AC.state === 'suspended') await AC.resume();
    soundOn = !soundOn;
    const now = AC.currentTime;
    earGain.gain.cancelScheduledValues(now);
    earGain.gain.setValueAtTime(earGain.gain.value, now);
    earGain.gain.linearRampToValueAtTime(soundOn ? EAR_GAIN : 0, now + 0.8);
    sndEl.textContent = soundOn ? 'S · 聲 ●' : 'S · 聲 ○';
  } catch (e){ ERRS.push('audio: ' + String(e && e.message || e)); }
}
addEventListener('keydown', e => { if (e.key === 's' || e.key === 'S') toggleSound(); });
sndEl.addEventListener('pointerdown', toggleSound);
if (Q.get('sound') === '1') toggleSound();   // headless door; gesture policy may keep it silent live

// ---------- probe (headless verification; reads the world, never writes it) ----------
function fnv1a(ints){ let h = 0x811c9dc5;
  for (const v of ints){ h ^= (v & 0xff); h = Math.imul(h, 0x01000193);
    h ^= ((v>>8) & 0xff); h = Math.imul(h, 0x01000193);
    h ^= ((v>>16) & 0xff); h = Math.imul(h, 0x01000193); }
  return (h>>>0).toString(16); }
function fieldHash(tp){
  const q = [];
  for (let j=0; j<24; j++) for (let i=0; i<24; i++){
    const x = (i/23)*2-1, y = (j/23)*2-1;
    const [re, im] = psi(x, y, tp);
    q.push(Math.round(re*1000)|0, Math.round(im*1000)|0);
  }
  return fnv1a(q);
}
function singularities(tp){
  // winding number on a 48x48 grid of cells; wrap phase diffs around each cell
  const G = 48, ph = [], amp2 = [];
  let maxA2 = 0;
  for (let j=0; j<=G; j++) for (let i=0; i<=G; i++){
    const x = (i/G)*2-1, y = (j/G)*2-1;
    const [re, im] = psi(x, y, tp);
    ph.push(Math.atan2(im, re)); const a2 = re*re+im*im; amp2.push(a2);
    if (a2 > maxA2) maxA2 = a2;
  }
  const W = G+1, wrap = d => { while (d >  Math.PI) d -= 2*Math.PI;
                               while (d < -Math.PI) d += 2*Math.PI; return d; };
  let count = 0, dark = 0;
  for (let j=0; j<G; j++) for (let i=0; i<G; i++){
    const p00 = ph[j*W+i], p10 = ph[j*W+i+1], p11 = ph[(j+1)*W+i+1], p01 = ph[(j+1)*W+i];
    const w = wrap(p10-p00) + wrap(p11-p10) + wrap(p01-p11) + wrap(p00-p01);
    if (Math.abs(w) > 5){
      count++;
      const cellMin = Math.min(amp2[j*W+i], amp2[j*W+i+1], amp2[(j+1)*W+i+1], amp2[(j+1)*W+i]);
      if (cellMin / maxA2 < 0.05) dark++;
    }
  }
  return { count, dark };
}
// shader<->JS mirror check: render ONE probe frame at fixed (tau, act 0),
// read pixels, compare to the JS-predicted gray value. Rendering is a pure
// function of uniforms — the world (tau schedule) is untouched.
function mirrorCheck(tp){
  gl.uniform1f(uTau, tp); gl.uniform1i(uAct, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  const w = cv.width, h = cv.height, asp = w/h, pts = [];
  let maxErr = 0;
  for (const [fx, fy] of [[0.3,0.3],[0.5,0.5],[0.7,0.4],[0.25,0.7],[0.65,0.75]]){
    const px = Math.round(fx*w), py = Math.round(fy*h);
    const buf8 = new Uint8Array(4);
    gl.readPixels(px, py, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, buf8);
    const wx = ((px + 0.5)/w*2 - 1) * asp, wy = (py + 0.5)/h*2 - 1;
    const [re, im] = psi(wx, wy, tp);
    const I = (re*re + im*im)/(AMAX*AMAX);
    const g = 0.051 + (0.792 - 0.051)*Math.pow(I, 0.65);
    const err = Math.abs(buf8[0]/255 - g);
    if (err > maxErr) maxErr = err;
    pts.push(+err.toFixed(4));
  }
  return { maxErr: +maxErr.toFixed(4), perPoint: pts };
}
// audio probe (pass 2): offline renders need no gesture — the ear can be
// verified headless even though live playback is gesture-gated.
function envSweep(){
  // P7 — latent silence: envelope |psi|/N at each ear across one 180 s cycle
  return EARS.map(E => {
    let mn = 1e9, mx = 0, dips = 0, below = false;
    for (let t7 = 0; t7 < 180; t7 += 0.25){
      const [re, im] = psi(E.x, E.y, t7);
      const env = Math.sqrt(re*re + im*im) / NSRC;
      if (env < mn) mn = env; if (env > mx) mx = env;
      if (env < 0.10){ if (!below){ dips++; below = true; } } else below = false;
    }
    return { min:+mn.toFixed(4), max:+mx.toFixed(4), dips,
             range:+(mx/Math.max(mn,1e-6)).toFixed(1) };
  });
}
async function audioProbe(){
  const SR = 44100, DUR = 8, A_TAU0 = 30, BLK = 0.25;
  const render = async () => {
    const oc = new OfflineAudioContext(2, SR*DUR, SR);
    const node = await buildEar(oc, A_TAU0);
    node.connect(oc.destination);
    return await oc.startRendering();
  };
  const b1 = await render(), b2 = await render();
  // P8 — determinism + act-blind kernel: sample-exact hash equality of two renders
  const bufHash = buf => {
    const q = [];
    for (let c = 0; c < 2; c++){
      const d = buf.getChannelData(c);
      for (let i = 0; i < d.length; i++) q.push(Math.round(d[i]*32767)|0);
    }
    return fnv1a(q);
  };
  const h1 = bufHash(b1), h2 = bufHash(b2);
  // P6 — the ear hears the field: block RMS vs JS mirror |psi(x_ear)|/(N*sqrt2)
  const p6 = [];
  for (let c = 0; c < 2; c++){
    const d = b1.getChannelData(c), E = EARS[c];
    let mRel = 0, mAbs = 0;
    const nb = Math.floor(DUR/BLK);
    for (let b = 0; b < nb; b++){
      const i0 = Math.round(b*BLK*SR), i1 = Math.round((b+1)*BLK*SR);
      let s = 0; for (let i = i0; i < i1; i++) s += d[i]*d[i];
      const rms = Math.sqrt(s/(i1-i0));
      const [re, im] = psi(E.x, E.y, A_TAU0 + (b+0.5)*BLK);
      const env = Math.sqrt(re*re + im*im) / NSRC;
      const pred = env / Math.SQRT2;
      if (env > 0.07) mRel = Math.max(mRel, Math.abs(rms-pred)/pred);
      else mAbs = Math.max(mAbs, Math.abs(rms-pred));
    }
    p6.push({ maxRelErr:+mRel.toFixed(4), maxAbsErr:+mAbs.toFixed(4) });
  }
  return { fc: FC, ears: EARS.map(E => [+E.x.toFixed(4), +E.y.toFixed(4)]),
           p6, p7: envSweep(), p8: { h1, h2, equal: h1 === h2 }, sampleRate: SR };
}
if (PROBE){
  setTimeout(() => {
    const taus = [30, 90, 135, 165];
    const out = {
      piece: '009-latent-image', seed: SEED, sources: NSRC, solo: SOLO,
      pinnedAct: PIN_ACT, soundDoor: Q.get('sound') === '1',
      fieldHash: {}, sing: singularities(30),
      mirror: mirrorCheck(30), fps: 0, errors: ERRS
    };
    for (const tp of taus) out.fieldHash['tau'+tp] = fieldHash(tp);
    const audioP = audioProbe().then(a => { out.audio = a; })
                              .catch(e => { out.audioError = String(e && e.message || e); });
    Promise.all([audioP, new Promise(r => setTimeout(r, 4200))]).then(() => {
      out.fps = fps;
      const el = document.getElementById('probe');
      el.style.display = 'block';
      el.textContent = JSON.stringify(out);
      console.log('PROBE ' + JSON.stringify(out));
    });
  }, 300);
}
