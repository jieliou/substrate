  ══ 命題 ══
  同一個場、同一批光子,左右兩邊只差一件事:顆粒從哪來。
  左(骨相):粒子是光子。每幀以 p=0.08 抽樣「發射」,像素收到的是計數 —
    grain 是光子統計的殘響,活的,對場知情:暗處喘,亮處定。
  右(皮相):同一批光子長時間曝光收斂成一張「完美」的圖(快門自載入起
    一直開著),再蓋一層均勻的動態顆粒 — 質感是演出來的呼吸,對場全盲。
  裁決規則來自 lightfield 展覽一頁書:「評估任何 substrate 候選,先問它的
  grain 是長出來的還是貼上去的」。這張床把「問」變成「量」。

  的斜率證明相機看得見光子:shot-noise 極限 = 斜率 1;外加噪聲 = 斜率 0。
  銀鹽底片本來就是光子計數器;這裡用 PTC 證明一張渲染「看沒看過光子」。

  壽命指數分布(平均 240 幀),重生於圓盤。每幀每粒子以 p=0.08 發射一顆
  光子,落點 +1 計數(GPU additive blend 與 JS 逐 tile 計數共用同一份
  發射清單 — 鏡像不是統計近似,是同一串數字)。
  左顯示:每像素 EMA(α=0.3)的 log 曝光 tone map。
  右顯示:長曝光平均的同一 tone map,加 display-space 均勻動態顆粒 A=0.05。

    R_bone 預測 0.851(pass 4 acfBoneTile,lag4 線性內插 0.488);
    放大率 A = R_bone/R_skin 預測 1.852 — 眼睛把骨:皮的可見度差距乘 1.85。
  量測:同窗重放(F_STATS 1200 起 900 幀逐幀,tile 孔徑 16×16,合格 tile
  同 pass 3/4)。OLS 去趨勢殘差(同 pass 4 儀器署名)→ 6 幀 boxcar →
  R = std(boxcar)/std(raw),取合格 tile median。
  P10 眼睛的快門(留存率轉移,三門):
     (a) median R_bone ∈ [0.80, 0.90];
     (b) median R_skin ∈ [0.41, 0.51];
     (c) A ∈ [1.65, 2.05]。
  P11 呼吸住在哪個頻帶(periodogram,去趨勢殘差,排 DC):
     骨相 <3 Hz 功率佔比 median ≥ 0.6(τ_int 15 → Lorentzian 角頻 0.64 Hz,
     模型說 0.88,混合物不確定 → 寬門);皮相 ≤ 0.25(平坦理論 0.10 +
     畫布地板)。知覺翻譯:骨相的呼吸是 crawl/boil(慢煮),皮相是 shimmer
     (高頻閃)— 頻帶位置就是質感的名字。
  P12 眼見為憑(唯一不由機器裁的門,質性,誠實記錄):?eye=1 掛 live 門 —
     以 EMA(1/6) 近似 Bloch boxcar(具名近似:白噪聲留存 0.302 vs boxcar
     0.408,只供 live 展示,儀器用真 boxcar)渲染「眼睛的殘像」。並排定格
     (normal vs eye)後用眼睛判:骨相在眼視圖仍有結構性顆粒,皮相 overlay
     可見地塌向平坦。
  具名替代結局(事先寫下):
     1. R_skin > 0.51 → 畫布收斂在本窗壓過 hash — 眼睛看到的是謊底下
        畫布的呼吸,不是謊本身(報本輪皮相 ACF 地板)。
     2. R_bone < 0.80 → lag4 內插或 lag>5 尾巴比公式吃重 → 報公式差,
        儀器註記,命題不動(ACF 已在 pass 4 封帳)。
     3. P11 骨相 < 0.6 → 混合物中頻比 Lorentzian 摘要重 → 報頻譜形狀,
        命題由 P10 扛。
     4. P12 敗而 P10/P11 過 → 呼吸真實存在但低於 1× 觀看尺度的對比閾 —
        儀器聽得見、眼睛聽不見,這條縫本身就是讀數。
  門檻寫定於此,跑後不動。

  ══ pass 5 判決(2026-09-29 01:3x,?probe=4,~30s 收完)══
  **PASS 三門全綠 — 留存率轉移正中第三位小數**:
  P10 ✓ R_bone 量到 0.8516(預測 0.851)— 連三拍預測收口:0.77→0.7789、
     2.1→2.105、0.851→0.8516。R_skin 0.4521(預測 0.460,白地板 0.4082;
     高於地板的部分 = 畫布收斂的呼吸,量到比預測略薄)。放大率 A = 1.884
     (預測 1.852)— **眼睛把骨:皮的可見度差距乘 1.88**。逐 tile:骨相
     0.799-0.891(緊),皮相 0.408-0.556(一塊 tile 正好落在白理論地板上)。
  P11 ✓ 骨相 <3Hz 佔比 0.669(門 0.6;Lorentzian 摘要說 0.879 — 混合物
     中頻比單一時標模型重,pass 4「記憶重心在中時標」的頻譜版,同一句話
     第二台儀器再說一次)。皮相 0.151(平坦理論 0.10 + 畫布地板)。
  P12 ✓(質性,誠實記錄):2×2 定格(pass5-eye-evidence.png)—
     骨相過眼:硬斑點軟化成滾煮狀,**顆粒結構全在**;皮相過眼:overlay
     可見地塌向奶油平滑,只剩微弱殘渣。與 P10 的 85% vs 45% 完全同調。
     誠實界線:定格只能裁「存活 vs 塌陷」;P11 預測的 crawl vs shimmer
     是時間質感,靜幀裁不了 — ?eye=1 掛首頁,活人用活的眼睛看。
  裁決規則第四讀法(知覺版):**看得見的,是有昨天的顆粒** — 眼睛不是
  中立的螢幕,它是鏈上最後一台顯影器,而它偏心 earned grain。皮相的謊
  在儀器前已三度露底,這拍證明它在觀者臉上也留不住。
  qualified 15/24;result JSON + evidence PNG 入 piece 目錄。門檻未動。
-->

<pre class="hud" id="probe"></pre>
<script>
'use strict';
// ---------- params ----------
const W = 768, H = 768, TILE = 16, TX = W/TILE, TY = H/TILE;
const Q = new URLSearchParams(location.search);
// pass-3 shutter door: ?alpha= overrides the bone's EMA memory length (skin untouched)
const A_DOOR = parseFloat(Q.get('alpha') || '0.30');
const N = 200000, P_EMIT = 0.08, GRAIN_A = 0.05;
const ALPHA = Math.min(0.95, Math.max(0.005, isFinite(A_DOOR) ? A_DOOR : 0.30));
const SIGMA = 110, GAMMA = 254, BETA = 0.00225, JIT = 0.45;
const LIFE_Q = 1/240, SPAWN_R = 350;
const PROBE = Q.get('probe') === '1';
const PROBE2 = Q.get('probe') === '2';            // pass 3: shutter sweep
const PROBE3 = Q.get('probe') === '3';            // pass 4: temporal color (ACF)
const PROBE4 = Q.get('probe') === '4';            // pass 5: the eye's shutter (Bloch boxcar)
const EYE = Q.get('eye') === '1';                 // pass 5 live gate: the eye's residue
const PROBING = PROBE || PROBE2 || PROBE3 || PROBE4;
const STAT_LEN = parseInt(Q.get('frames') || '600', 10);
const A_LADDER = [0.6, 0.45, 0.3, 0.2, 0.12, 0.08, 0.05, 0.03];
const P5_START = 1200, P5_END = 2400;             // probe-2 phase B window
const SEG_COLLECT = 300;                          // probe-2 phase C per-α frames (every 2 → 150 samples)
// probe warmup 1200: core-filling relaxation ~ lifetime 240f x spiral-in 1/beta ~444f;
// first run (warmup 450) put Fano~11 drift into dense tiles — trend, not fluctuation.
const F_EXPOSE = PROBING ? 1100 : 400, F_STATS = PROBING ? 1200 : 450;

// ---------- rng (xorshift32, seed 7) ----------
let rs = 7 >>> 0;
function rnd() { rs ^= rs << 13; rs >>>= 0; rs ^= rs >> 17; rs ^= rs << 5; rs >>>= 0; return rs / 4294967296; }

// ---------- world ----------
const CX = W/2, CY = H/2;
const CTR = [0, 1, 2].map(i => {
  const a = (Math.PI/2) + i * 2*Math.PI/3;
  return [CX + 170*Math.cos(a), CY + 170*Math.sin(a)];
});
const px = new Float32Array(N), py = new Float32Array(N);
function spawn(i) {
  // half in disc, half near cores — shortens the spiral-in transient
  if (rnd() < 0.5) {
    const r = SPAWN_R * Math.sqrt(rnd()), a = rnd()*2*Math.PI;
    px[i] = CX + r*Math.cos(a); py[i] = CY + r*Math.sin(a);
  } else {
    const c = CTR[(rnd()*3)|0];
    px[i] = c[0] + (rnd()+rnd()+rnd()-1.5)*40;
    py[i] = c[1] + (rnd()+rnd()+rnd()-1.5)*40;
  }
}
for (let i = 0; i < N; i++) spawn(i);

const S2 = 2*SIGMA*SIGMA;
function step() {
  for (let i = 0; i < N; i++) {
    let x = px[i], y = py[i], vx = 0, vy = 0;
    for (let k = 0; k < 3; k++) {
      const dx = x - CTR[k][0], dy = y - CTR[k][1];
      const g = Math.exp(-(dx*dx + dy*dy)/S2);
      const s = GAMMA * g / (SIGMA*SIGMA);
      vx += -dy*s - BETA*g*dx;   // swirl (rot90 of gradient) + attraction
      vy +=  dx*s - BETA*g*dy;
    }
    x += vx + (rnd()-0.5)*2*JIT;
    y += vy + (rnd()-0.5)*2*JIT;
    px[i] = x; py[i] = y;
    if (rnd() < LIFE_Q || x < 0 || x >= W || y < 0 || y >= H) spawn(i);
  }
}

// ---------- gl ----------
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false });
if (!gl) throw new Error('webgl2 required');
if (!gl.getExtension('EXT_color_buffer_float')) throw new Error('EXT_color_buffer_float required');
gl.getExtension('EXT_float_blend'); // optional; deposit target is 16F

function sh(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function prog(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}
function tex(ifmt) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texStorage2D(gl.TEXTURE_2D, 1, ifmt, W, H);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}
function fbo(t) {
  const f = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  return f;
}
const depT = tex(gl.RGBA16F), depF = fbo(depT);
const emaT = [tex(gl.RGBA32F), tex(gl.RGBA32F)], emaF = [fbo(emaT[0]), fbo(emaT[1])];
const sumT = [tex(gl.RGBA32F), tex(gl.RGBA32F)], sumF = [fbo(sumT[0]), fbo(sumT[1])];
let emaP = 0, sumP = 0;

// deposit: points, additive
const depProg = prog(
`#version 300 es
in vec2 aPos; uniform vec2 uRes;
void main(){ gl_Position = vec4(aPos/uRes*2.0-1.0, 0.0, 1.0); gl_PointSize = 1.0; }`,
`#version 300 es
precision highp float; out vec4 o;
void main(){ o = vec4(1.0, 0.0, 0.0, 1.0); }`);
const depLocPos = gl.getAttribLocation(depProg, 'aPos');
const depLocRes = gl.getUniformLocation(depProg, 'uRes');
const emitBuf = new Float32Array(N*2);
const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, emitBuf.byteLength, gl.DYNAMIC_DRAW);

// fullscreen helpers
const FSV = `#version 300 es
void main(){ vec2 p = vec2((gl_VertexID<<1)&2, gl_VertexID&2); gl_Position = vec4(p*2.0-1.0, 0.0, 1.0); }`;
// ema update
const emaProg = prog(FSV, `#version 300 es
precision highp float; uniform sampler2D uPrev, uDep; uniform float uA; out vec4 o;
void main(){ ivec2 p = ivec2(gl_FragCoord.xy);
  float e = texelFetch(uPrev, p, 0).r, d = texelFetch(uDep, p, 0).r;
  o = vec4(mix(e, d, uA), 0.0, 0.0, 1.0); }`);
// sum update
const sumProg = prog(FSV, `#version 300 es
precision highp float; uniform sampler2D uPrev, uDep; out vec4 o;
void main(){ ivec2 p = ivec2(gl_FragCoord.xy);
  o = vec4(texelFetch(uPrev, p, 0).r + texelFetch(uDep, p, 0).r, 0.0, 0.0, 1.0); }`);
// display
const dispProg = prog(FSV, `#version 300 es
precision highp float;
uniform sampler2D uEma, uSum; uniform float uK, uA, uCount, uGA, uFrame;
out vec4 o;
float hash(vec3 v){ return fract(sin(dot(v, vec3(127.1, 311.7, 74.7)))*43758.5453); }
void main(){
  vec2 fc = gl_FragCoord.xy;
  bool bone = fc.x < 768.0;
  ivec2 p = ivec2(mod(fc.x, 768.0), fc.y);
  float d;
  if (bone) {
    d = 1.0 - exp(-uK * texelFetch(uEma, p, 0).r);   // EMA time-mean == per-frame rate: same exposure as skin
  } else {
    float m = texelFetch(uSum, p, 0).r / max(uCount, 1.0);
    d = 1.0 - exp(-uK * m);
    d += uGA * (hash(vec3(fc.xy, uFrame)) * 2.0 - 1.0);   // applied grain, display space, field-blind
  }
  d = clamp(d, 0.0, 1.0);
  vec3 silver = vec3(0.972, 0.976, 0.984);        // near-neutral silver, film register
  o = vec4(silver * d, 1.0);
}`);
const dl = {
  ema: gl.getUniformLocation(dispProg, 'uEma'),
  sum: gl.getUniformLocation(dispProg, 'uSum'),
  k: gl.getUniformLocation(dispProg, 'uK'),
  a: gl.getUniformLocation(dispProg, 'uA'),
  count: gl.getUniformLocation(dispProg, 'uCount'),
  ga: gl.getUniformLocation(dispProg, 'uGA'),
  frame: gl.getUniformLocation(dispProg, 'uFrame'),
};

// ---------- JS mirror (same numbers, not a statistical model) ----------
const tileCount = new Float64Array(TX*TY);       // this frame's deposits per tile
const tileSum = new Float64Array(TX*TY);         // running sum since shutter
const tileEma = new Float64Array(TX*TY);         // tile-sum EMA mirror (linear => exact)
let shutterFrames = 0;
let frame = 0, K_EXP = 0.15, kFrozen = false;

// probe state
let probeTiles = [];        // [{ti, cx, cy}] 24 tiles
let statN = 0;
let emaSeries = null;       // per-tile running mean/var (Welford)
let pixEma = null;          // per designated center pixel EMA mirror
let dispStats = null;       // per tile {bone: Welford, skin: Welford} on 4x4 patch mean bytes
// probe-2 state (pass 3)
const mirrors = PROBE2 ? A_LADDER.map(() => new Float64Array(TX*TY)) : null;
let p5Series = null;        // [k][j]: mirrors[k] series at probe tile j (phase B)
let p6Stats = null;         // [k][j]: {bone:[], skin:[]} display patch means (phase C)
let segK = -1, segMode = 'idle', segT = 0;
let curA = ALPHA;           // GPU EMA coefficient — phase C sweeps this; live/probe-1 constant
const pixByte = new Uint8Array(4);
const patchByte = new Uint8Array(4*4*4);
// probe-3 state (pass 4): per-frame series at two apertures + linear mirror
const T3 = 900, MAXLAG3 = 40;
let p7Series = null;        // [j] = { boneT, skinT, boneP, skinP, lin } (T3-frame series)
let p7n = 0;
const frameByte = (PROBE3 || PROBE4) ? new Uint8Array(1536*768*4) : null;  // one sync per frame, extract in JS
// probe-4 state (pass 5): tile display series only, same window as probe 3
let p8Series = null;        // [j] = { boneT, skinT }
let p8n = 0;
let eyeCtx = null;          // ?eye=1 residue canvas

function welford() { return { n:0, m:0, M2:0 }; }
function wPush(w, x) { w.n++; const d = x - w.m; w.m += d/w.n; w.M2 += d*(x - w.m); }
function wVar(w) { return w.n > 1 ? w.M2/(w.n-1) : 0; }

function pickTiles() {
  const cand = [];
  for (let t = 0; t < TX*TY; t++) {
    const mu = tileSum[t] / Math.max(shutterFrames, 1);
    if (mu > 0.05) cand.push([mu, t]);
  }
  cand.sort((a, b) => a[0] - b[0]);
  const lo = cand[Math.floor(cand.length*0.50)][0];
  const hi = cand[Math.min(cand.length-1, Math.floor(cand.length*0.995))][0];
  const used = new Set();
  for (let j = 0; j < 24; j++) {
    const target = Math.exp(Math.log(lo) + (Math.log(hi)-Math.log(lo))*j/23);
    let best = null, bd = 1e9;
    for (const [mu, t] of cand) {
      if (used.has(t)) continue;
      const d = Math.abs(Math.log(mu) - Math.log(target));
      if (d < bd) { bd = d; best = t; }
    }
    used.add(best);
    probeTiles.push({ ti: best, tx: best % TX, ty: (best/TX)|0 });
  }
  if (PROBE) {
    emaSeries = probeTiles.map(() => []);        // full series → detrended variance
    pixEma = probeTiles.map(() => 0);
    dispStats = probeTiles.map(() => ({ bone: [], skin: [] }));
  }
  if (PROBE2) {
    p5Series = A_LADDER.map(() => probeTiles.map(() => []));
    p6Stats = A_LADDER.map(() => probeTiles.map(() => ({ bone: [], skin: [] })));
  }
  if (PROBE3) p7Series = probeTiles.map(() => ({ boneT: [], skinT: [], boneP: [], skinP: [], lin: [] }));
  if (PROBE4) p8Series = probeTiles.map(() => ({ boneT: [], skinT: [] }));
}
// variance of residuals after removing OLS linear trend — kills leftover
// convergence drift symmetrically on both sides (instrument, not thesis)
function detrendVar(series) {
  const n = series.length;
  if (n < 3) return { mean: 0, v: 0 };
  const xs = series.map((_, i) => i);
  const f = ols(xs, series);
  let m = 0; for (const y of series) m += y; m /= n;
  let M2 = 0;
  for (let i = 0; i < n; i++) { const r = series[i] - (f.intercept + f.slope*i); M2 += r*r; }
  return { mean: m, v: M2/(n-2) };
}

function autoExpose() {
  const mus = [];
  for (let t = 0; t < TX*TY; t++) {
    const mu = tileSum[t] / Math.max(shutterFrames, 1);
    if (mu > 0) mus.push(mu);
  }
  mus.sort((a, b) => a - b);
  const v99 = mus[Math.floor(mus.length*0.99)] / (TILE*TILE);   // per-pixel rate
  K_EXP = 3.0 / Math.max(v99, 1e-6);
}

// ---------- frame loop ----------
let emitCount = 0;
const probeOut = { piece: '010-earned-grain', seed: 7, params: { N, P_EMIT, ALPHA, GRAIN_A, SIGMA, GAMMA, BETA, JIT } };

function tick() {
  step();
  // emission sampling — the shot-noise source. JS and GPU consume this same list.
  emitCount = 0;
  tileCount.fill(0);
  const centerHits = pixEma ? new Float64Array(probeTiles.length) : null;
  for (let i = 0; i < N; i++) {
    if (rnd() < P_EMIT) {
      const ix = px[i]|0, iy = py[i]|0;
      emitBuf[emitCount*2] = ix + 0.5;
      emitBuf[emitCount*2+1] = iy + 0.5;
      emitCount++;
      tileCount[((iy/TILE)|0)*TX + ((ix/TILE)|0)]++;
      if (centerHits) {
        for (let j = 0; j < probeTiles.length; j++) {
          const t = probeTiles[j];
          if (ix === t.tx*TILE + 8 && iy === t.ty*TILE + 8) centerHits[j]++;
        }
      }
    }
  }
  shutterFrames++;
  for (let t = 0; t < TX*TY; t++) {
    tileSum[t] += tileCount[t];
    tileEma[t] = tileEma[t]*(1-ALPHA) + ALPHA*tileCount[t];
  }
  // probe 2: eight parallel shutters over the SAME emission stream (α never touches rnd —
  // literally the same photons, eight memories). Warm from frame 0.
  if (PROBE2) for (let k = 0; k < A_LADDER.length; k++) {
    const a = A_LADDER[k], m = mirrors[k];
    for (let t = 0; t < TX*TY; t++) m[t] = m[t]*(1-a) + a*tileCount[t];
  }
  if (pixEma) for (let j = 0; j < probeTiles.length; j++)
    pixEma[j] = pixEma[j]*(1-ALPHA) + ALPHA*centerHits[j];

  // GPU: deposit
  gl.disable(gl.DEPTH_TEST);
  gl.bindFramebuffer(gl.FRAMEBUFFER, depF);
  gl.viewport(0, 0, W, H);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.useProgram(depProg);
  gl.uniform2f(depLocRes, W, H);
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, emitBuf.subarray(0, emitCount*2));
  gl.enableVertexAttribArray(depLocPos);
  gl.vertexAttribPointer(depLocPos, 2, gl.FLOAT, false, 0, 0);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  gl.drawArrays(gl.POINTS, 0, emitCount);
  gl.disable(gl.BLEND);

  // EMA update
  gl.bindFramebuffer(gl.FRAMEBUFFER, emaF[1-emaP]);
  gl.useProgram(emaProg);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, emaT[emaP]);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, depT);
  gl.uniform1i(gl.getUniformLocation(emaProg, 'uPrev'), 0);
  gl.uniform1i(gl.getUniformLocation(emaProg, 'uDep'), 1);
  gl.uniform1f(gl.getUniformLocation(emaProg, 'uA'), curA);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  emaP = 1 - emaP;

  // SUM update
  gl.bindFramebuffer(gl.FRAMEBUFFER, sumF[1-sumP]);
  gl.useProgram(sumProg);

      p7Series[j].skinT.push(rectMean(frameByte, 768 + x, y, 16, 16));
      p7Series[j].boneP.push(rectMean(frameByte, x + 6, y + 6, 4, 4));
      p7Series[j].skinP.push(rectMean(frameByte, 768 + x + 6, y + 6, 4, 4));

    for (let j = 0; j < probeTiles.length; j++) {

function ols(xs, ys) {

function pearson(xs, ys) {

  let maxErr = 0;

// ---------- pass 3 verdicts (probe 2) ----------

      pass: Rb >= 0.80 && Rb <= 0.90 && Rs >= 0.41 && Rs <= 0.51 && A >= 1.65 && A <= 2.05 },
    P11_breathBand: {
      fracBoneLow3Hz: +fB.toFixed(3), fracSkinLow3Hz: +fS.toFixed(3),
      lorentzModel: 0.879, flatTheory: 0.10,
      pass: fB >= 0.6 && fS <= 0.25 },
    P12_seeing: 'outside the page — ?eye=1 screenshots, human judgment, verdict in header comment',
    readings: { qualifiedTiles: qual.length,
      retBoneAll: rB.map(r => +retn(r).toFixed(3)),
      retSkinAll: rS.map(r => +retn(r).toFixed(3)) },
  };
  verdict.PASS_machine = verdict.P10_eyeShutter.pass && verdict.P11_breathBand.pass;
  probeOut.frames = { expose: F_EXPOSE, statsStart: F_STATS, T4: T3 };
  probeOut.K_EXP = K_EXP;
  probeOut.verdict5 = verdict;
  const el = document.getElementById('probe');
  el.textContent = JSON.stringify(probeOut, null, 1);
  el.style.display = 'block';
  window.__PROBE_RESULT = probeOut;
  document.title = '010 probe4 ' + (verdict.PASS_machine ? 'PASS' : 'FAIL');
}

if (EYE) {
  const ec = document.createElement('canvas');
  ec.width = canvas.width; ec.height = canvas.height;
  ec.style.cssText = 'position:absolute;left:0;top:0;width:100%;display:block';
  document.getElementById('wrap').insertBefore(ec, document.getElementById('divider'));
  eyeCtx = ec.getContext('2d');
  document.getElementById('tagL').innerHTML = '骨相 — 眼睛的殘像 <em>Bloch ≈ EMA(1/6)</em>';
  document.getElementById('tagR').innerHTML = '<em>Bloch ≈ EMA(1/6)</em> 眼睛的殘像 — 皮相';
}

if (Q.has('alpha')) document.getElementById('tagL').innerHTML =
  '骨相 — 長出來的 <em>photon-counted · α=' + ALPHA + '</em>';

tick();
</script>
